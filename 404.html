<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">

  <!-- 404 pages can be served from any path, so this one uses absolute paths for the GitHub Pages project site -->
  <link rel="stylesheet" href="/ProfessionalWebsite/assets/css/style.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; text-align: center; }
    .lost .drawing { max-width: 420px; margin: 0 auto 28px; aspect-ratio: 4 / 3; }
    .lost .drawing svg { stroke: var(--mines-sky); fill: none; stroke-width: 2; }
    .lost .drawing .gap { stroke: var(--mines-orange); stroke-dasharray: 6 6; }
    .lost p { color: var(--muted); max-width: 30em; margin: 0 auto 24px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <div class="drawing" aria-hidden="true">
        <svg viewBox="0 0 400 300">
          <path d="M60 210 L200 100 L340 210"/>
          <rect x="80" y="205" width="100" height="70"/>
          <rect class="gap" x="220" y="205" width="100" height="70"/>
          <text x="270" y="245" text-anchor="middle" fill="#cc4628" stroke="none" font-family="IBM Plex Mono, monospace" font-size="13">404</text>
        </svg>
      </div>
      <p class="sheet-label" style="justify-content:center">Sheet not found</p>
      <h1>This room is not on the blueprint.</h1>
      <p>The page you were looking for does not exist, or it moved during construction.</p>
      <a class="btn btn--primary" href="/ProfessionalWebsite/">Back to the front door</a>
    </div>
  </main>
</body>
</html>
